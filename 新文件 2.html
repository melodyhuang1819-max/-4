      display: flex;
      flex-direction: column;

      transform: translateY(-8px);
      box-shadow: var(--shadow-hover);

      overflow: hidden;
      position: relative;

      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.4s ease;
      display: block;

    }

        fullDesc: "急診室本應是守護生命的最後一道防線，卻在人手短缺與資源濫用的夾縫中，演變成一場情緒的戰場。我們看見，無數細小的需求堆疊成護理人員沈重的負擔，讓原本的救人之心在精疲力竭中逐漸冰冷。當病患因被忽略而憤怒，護理人員則因過勞而尖銳，這場因「誤解」而起的對立，讓我們決定透過鏡頭思考：在喧囂的急診室中，我們是否遺忘了那份最純粹的醫病溫度？",
        canvaEmbedUrls: [
          "https://www.canva.com/design/DAHNRuxI3UU/rjyQrkHEJXIZM1s8R_OgCg/view?embed",
          "https://www.canva.com/design/DAHHXSAqZOw/i2JwlnEiZNCz3zRkLQkVhw/view?embed"
        ],
        youtubeIds: ["cfHEPWEhGZ4"],
        tech: ["專題影片紀錄", "資訊視覺化", "空間安全研究", "Canva 簡報"]
      }
    ];

    const grid = document.getElementById('portfolio-grid');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalTag = document.getElementById('modal-tag');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const modalPosterWrapper = document.getElementById('modal-poster-wrapper');
    const modalPosterImg = document.getElementById('modal-poster-img');
    const modalPptWrapper = document.getElementById('modal-ppt-wrapper');
    const modalPptContainerList = document.getElementById('modal-ppt-container-list');
    const modalVideoWrapper = document.getElementById('modal-video-wrapper');
    const modalVideoContainerList = document.getElementById('modal-video-container-list');
    const modalTech = document.getElementById('modal-tech');

    // 渲染卡片 (自動處理網址編碼與大寫 .JPG 檔名備用切換)
    function renderGrid(filterCategory = 'all') {
      grid.innerHTML = '';
      projects.forEach((project, index) => {
        if (filterCategory !== 'all' && project.category !== filterCategory) return;

        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openModal(index);

        const encodedBase = encodeURIComponent(project.coverBaseName);

        card.innerHTML = `
          <div class="card-cover">
            <img src="./${encodedBase}.JPG" 
                 onerror="this.onerror=null; this.src='./${encodedBase}.jpg'; this.onerror=function(){ this.src='./${encodedBase}.png'; this.onerror=function(){ this.src='./${encodedBase}.PNG'; }; };" 
                 alt="${project.title}">
          </div>
          <div class="card-content">
            <span class="card-tag">${project.tag}</span>
            <h3 class="card-title">${project.title}</h3>
            <p class="card-desc">${project.shortDesc}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // 分類切換
    function filterProjects(category, btnElement) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      renderGrid(category);
    }

    // 開啟 Modal 視窗
    function openModal(index) {
      const project = projects[index];
      modalTag.textContent = project.tag;
      modalTitle.textContent = project.title;
      modalDesc.textContent = project.fullDesc;

      // 清空舊的內容
      modalPptContainerList.innerHTML = '';
      modalVideoContainerList.innerHTML = '';

      // 渲染研究海報圖片
      if (project.posterImgName) {
        const encodedPoster = encodeURIComponent(project.posterImgName);
        modalPosterImg.src = `./${encodedPoster}.JPG`;
        modalPosterImg.onerror = function() {
          this.onerror = null;
          this.src = `./${encodedPoster}.png`;
        };
        modalPosterWrapper.style.display = 'block';
      } else {
        modalPosterWrapper.style.display = 'none';
      }

      // 渲染 Canva 簡報
      if (project.canvaEmbedUrls && project.canvaEmbedUrls.length > 0) {
        project.canvaEmbedUrls.forEach((url) => {
          const wrapper = document.createElement('div');
          wrapper.className = 'embed-container';
          if (project.canvaEmbedUrls.length > 1) {
            wrapper.style.marginBottom = '1.2rem';
          }
          wrapper.innerHTML = `<iframe src="${url}" allowfullscreen="true" allow="fullscreen"></iframe>`;
          modalPptContainerList.appendChild(wrapper);
        });
        modalPptWrapper.style.display = 'block';
      } else {
        modalPptWrapper.style.display = 'none';
      }

      // 渲染 YouTube 影片
      if (project.youtubeIds && project.youtubeIds.length > 0) {
        project.youtubeIds.forEach((id) => {
          const wrapper = document.createElement('div');
          wrapper.className = 'embed-container';
          if (project.youtubeIds.length > 1) {
            wrapper.style.marginBottom = '1.2rem';
          }
          wrapper.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=0&playsinline=1&rel=0" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
          modalVideoContainerList.appendChild(wrapper);
        });
        modalVideoWrapper.style.display = 'block';
      } else {
        modalVideoWrapper.style.display = 'none';
      }

      modalTech.innerHTML = project.tech.map(t => `<span class="tech-badge">${t}</span>`).join('');
      modalOverlay.classList.add('active');
    }

    // 關閉 Modal
    function closeModal() {
      modalOverlay.classList.remove('active');
      modalPptContainerList.innerHTML = '';
      modalVideoContainerList.innerHTML = '';
    }

    modalOverlay.onclick = function(e) {
      if (e.target === modalOverlay) closeModal();
    };

    // 初始化渲染
    renderGrid('all');
  </script>
</body>
</html>
